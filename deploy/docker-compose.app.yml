# Full stack compose (infra + API + SPA).
# Usage from repo root:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml --profile docker-db up -d --build
#
# Set Jwt__SigningKey (≥32 chars) before production use.

services:
  postgres:
    profiles: ["docker-db"]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: nexuscrm-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nexuscrm;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Cors__Origins__0: http://localhost:8088
      Jwt__Issuer: NexusCRM
      Jwt__Audience: NexusCRM.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-NexusCRM-Compose-Dev-Signing-Key-Change-Me-32+}
      Jwt__AccessTokenMinutes: "15"
      Security__ExposeMetricsEndpoint: "false"
      OpenTelemetry__Enabled: "true"
      OpenTelemetry__ServiceName: NexusCRM.Api
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        API_BASE_URL: http://localhost:8080
    container_name: nexuscrm-web
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
